name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["Static Analysis"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Auto-merge Dependabot PR
        run: |
          PR_URL="${{ github.event.workflow_run.pull_requests[0].html_url }}"
          if [ -z "$PR_URL" ] || [ "$PR_URL" = "null" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            PR_URL=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].html_url // empty')
          fi

          if [ -n "$PR_URL" ] && [ "$PR_URL" != "null" ]; then
            PR_AUTHOR=$(gh pr view "$PR_URL" --json author --jq '.author.login')
            if [ "$PR_AUTHOR" = "app/dependabot" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "dependabot" ]; then
              echo "Merging Dependabot PR ($PR_URL)..."
              gh pr merge "$PR_URL" --merge --delete-branch
            else
              echo "PR ($PR_URL) is not by Dependabot ($PR_AUTHOR), skipping."
            fi
          else
            echo "No associated PR found for this workflow run."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


