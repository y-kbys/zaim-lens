name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["Static Analysis"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Auto-merge Dependabot PR
        run: |
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$HEAD_BRANCH" --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            PR_AUTHOR=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json author --jq '.author.login')
            if [ "$PR_AUTHOR" = "app/dependabot" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "dependabot" ]; then
              echo "Merging Dependabot PR (#$PR_NUMBER)..."
              gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --merge --delete-branch
            else
              echo "PR (#$PR_NUMBER) is not by Dependabot ($PR_AUTHOR), skipping."
            fi
          else
            echo "No associated PR found for branch $HEAD_BRANCH."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}




