name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["Static Analysis"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Auto-merge Dependabot PR
        run: |
          PR_NUMBER=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} --jq '.pull_requests[0].number')
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
            if [ "$PR_AUTHOR" = "app/dependabot" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "dependabot" ]; then
              echo "Merging Dependabot PR #$PR_NUMBER..."
              gh pr merge "$PR_NUMBER" --merge --delete-branch
            else
              echo "PR #$PR_NUMBER is not by Dependabot ($PR_AUTHOR), skipping."
            fi
          else
            echo "No PR associated with this workflow run, skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
