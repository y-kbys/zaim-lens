name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
# Cancel in-progress runs when a new push occurs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build:css
          npm run build:licenses

      - name: Run frontend tests
        run: npm run test

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run backend tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Update SW version (App version passed via Env)
        run: |
          VERSION="v${{ github.run_number }}"
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'zaim-lens-${VERSION}';/" static/sw.js
          echo "SW Cache Name updated to: zaim-lens-${VERSION}"

      - name: Generate env.yaml
        env:
          DEVELOPER_EMAILS: ${{ secrets.DEVELOPER_EMAILS }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          ZAIM_CALLBACK_URL: ${{ secrets.ZAIM_CALLBACK_URL }}
          ZAIM_CONSUMER_KEY: ${{ secrets.ZAIM_CONSUMER_KEY }}
          ZAIM_CONSUMER_SECRET: ${{ secrets.ZAIM_CONSUMER_SECRET }}
          APP_VERSION: v${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import json, os

          keys = [
              "DEVELOPER_EMAILS",
              "ENCRYPTION_KEY",
              "FIREBASE_API_KEY",
              "FIREBASE_APP_ID",
              "FIREBASE_AUTH_DOMAIN",
              "FIREBASE_MEASUREMENT_ID",
              "FIREBASE_MESSAGING_SENDER_ID",
              "FIREBASE_STORAGE_BUCKET",
              "GA_MEASUREMENT_ID",
              "ZAIM_CALLBACK_URL",
              "ZAIM_CONSUMER_KEY",
              "ZAIM_CONSUMER_SECRET",
              "APP_VERSION",
          ]

          lines = []
          for k in keys:
              v = os.environ.get(k)
              if v:
                  lines.append(f"{k}: {json.dumps(v)}")

          with open("env.yaml", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF
          echo "Generated env.yaml for environment: ${{ github.event.repository.default_branch == github.ref_name && 'prod' || 'dev' }}"
          # Show non-sensitive keys for debugging
          cat env.yaml | sed 's/: .*/: ***/'

      - name: Deploy to Cloud Run
        run: |
          SERVICE_NAME=${{ github.ref == 'refs/heads/main' && 'zaim-lens' || 'zaim-lens-dev' }}
          echo "Deploying to Service: $SERVICE_NAME"
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --env-vars-file env.yaml \
            --cpu-boost



