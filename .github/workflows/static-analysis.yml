name: Static Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test

      - name: Run static analysis (Type Check)
        run: npm run type-check

      - name: Verify Tailwind CSS build is up to date
        run: |
          npm run check:css || (echo "::error::static/tailwind.css is out of date. Please run 'npm run build:css' and commit the changes." && exit 1)

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run pytest
