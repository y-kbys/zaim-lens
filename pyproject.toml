[project]
name = "zaim-lens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.5.0",
    "google-genai>=2.17.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "requests-oauthlib>=2.0.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

